<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · JD Fallas</title><meta name="theme-color" content="#f2f2f3">
<script src="/shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/ui.css">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}
main{width:min(400px,100%);padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#FF7F66,#2F6BFF);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.4px} p.s{margin:0 0 22px;color:var(--ink2)}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 6px}
input{width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:17px;padding:0 14px}
input:focus{outline:none;border-color:var(--ink)}
button.go{margin-top:20px;width:100%;height:54px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
button.go:disabled{opacity:.5}
.msg{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:14px;display:none}
.msg.err{display:block;background:rgba(229,72,77,.1);color:#C2292E}
.msg.ok{display:block;background:rgba(34,160,107,.1)}
.nota{margin-top:22px;font-size:12.5px;color:var(--ink3);text-align:center}
</style></head><body><main>
<div class="logo">JD</div>
<h1>JD Fallas</h1><p class="s" id="sub">Entra con tu número de control</p>
<form id="f" autocomplete="on">
  <label for="num">Número de control</label>
  <input id="num" name="username" inputmode="numeric" autocomplete="username" required>
  <div id="paso1"><label for="pin">Contraseña</label><input id="pin" name="password" type="password" autocomplete="current-password"></div>
  <div id="paso2" hidden>
    <label for="p1">Crea tu contraseña (mínimo 4)</label><input id="p1" type="password" autocomplete="new-password">
    <label for="p2">Repítela</label><input id="p2" type="password" autocomplete="new-password">
  </div>
  <button class="go" id="go">Entrar</button>
  <div class="msg" id="msg"></div>
</form>
<div class="nota">¿No tienes acceso? Pide tu alta al administrador.</div>
</main>
<script>
const $ = id => document.getElementById(id);
const next = (new URLSearchParams(location.search).get('next') || '/') + location.hash;
let modo = 'login';
const msg = (t, ok) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (t ? (ok ? 'ok' : 'err') : ''); };
async function post(path, data){ const r = await fetch('/api/' + path, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(data)}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || 'Error'); return j; }
$('f').onsubmit = async e => {
  e.preventDefault(); msg(''); $('go').disabled = true;
  const num = $('num').value.trim();
  try{
    if(modo === 'login'){
      const j = await post('login', {num, pin: $('pin').value});
      if(j.crearPin){ modo = 'pin'; $('paso1').hidden = true; $('paso2').hidden = false; $('sub').textContent = `Hola ${j.nombre}, es tu primera vez: crea tu contraseña.`; $('go').textContent = 'Guardar y entrar'; $('p1').focus(); }
      else location.replace(next.startsWith('/') ? next : '/');
    } else {
      if($('p1').value !== $('p2').value) throw new Error('Las contraseñas no coinciden.');
      await post('pin', {num, pin: $('p1').value});
      location.replace(next.startsWith('/') ? next : '/');
    }
  }catch(err){ msg(err.message); }
  $('go').disabled = false;
};
$('num').focus();
</script></body></html>
