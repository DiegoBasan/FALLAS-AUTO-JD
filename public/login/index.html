<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · JD Fallas</title>
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JD Fallas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<script src="/shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/ui.css">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}
main{width:min(400px,100%);padding:calc(env(safe-area-inset-top) + 24px) 18px calc(96px + env(safe-area-inset-bottom))}
.logo{width:76px;height:76px;border-radius:22px;display:block;margin-bottom:18px;box-shadow:0 12px 30px rgba(242,101,79,.3)}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px} p.s{margin:0 0 22px;color:var(--ink2)}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 6px}
input{width:100%;height:58px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:22px;font-weight:700;letter-spacing:1px;padding:0 16px}
input[type=password]{font-size:18px}
input:focus{outline:none;border-color:var(--ink)}
button.go{margin-top:18px;width:100%;height:58px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-size:17px;font-weight:800;cursor:pointer}
button.go:disabled{opacity:.5}
.msg{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:14px;display:none}
.msg.err{display:block;background:rgba(229,72,77,.1);color:#C2292E}
.nota{margin-top:22px;font-size:12.5px;color:var(--ink3);text-align:center}
.nota a{text-decoration:underline}
</style></head><body><main>
<img class="logo" src="/icons/icon-192.png" alt="">
<h1 id="ttl">JD Fallas</h1><p class="s" id="sub">Entra con tu número de control</p>
<form id="f" autocomplete="on">
  <label for="num">Número de control</label>
  <input id="num" name="username" inputmode="numeric" autocomplete="username" enterkeyhint="go" required>
  <div id="pw" hidden><label for="pin" id="pinLb">Contraseña del panel</label><input id="pin" name="password" type="password" autocomplete="current-password"></div>
  <button class="go" id="go">Entrar</button>
  <div class="msg" id="msg"></div>
</form>
<div class="nota" id="nota">¿No tienes acceso? Pide tu alta al administrador.</div>
</main>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const admin = qs.get('admin') === '1';
let next = (qs.get('next') || '/') + location.hash;
if(!next.startsWith('/') || next.startsWith('//')) next = '/';
const msg = t => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (t ? 'err' : ''); };
async function post(path, data){ const r = await fetch('/api/' + path, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(data)}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || 'Error'); return j; }
try{ $('num').value = localStorage.getItem('jd_num') || ''; }catch(e){}
if(admin){
  $('ttl').textContent = 'Panel admin'; $('sub').textContent = 'Confirma tu contraseña para administrar.';
  $('pw').hidden = false; $('go').textContent = 'Entrar al panel';
  $('nota').innerHTML = '<a href="/">Regresar a la app</a>';
}
$('f').onsubmit = async e => {
  e.preventDefault(); msg(''); $('go').disabled = true;
  const num = $('num').value.trim();
  try{
    if(admin){
      const j = await post('admin-login', {num, pin: $('pin').value});
      if(j.crearPin){ $('pinLb').textContent = 'Crea la contraseña del panel (mínimo 4)'; $('pin').value=''; $('pin').autocomplete='new-password'; $('pin').focus(); throw new Error('Primera vez: escribe la contraseña que vas a usar.'); }
    } else await post('login', {num});
    try{ localStorage.setItem('jd_num', num); }catch(e){}
    location.replace(next);
  }catch(err){ msg(err.message); }
  $('go').disabled = false;
};
(admin && $('num').value ? $('pin') : $('num')).focus();
</script></body></html>
