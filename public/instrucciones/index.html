<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Instrucciones · JD Fallas</title>
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JD Fallas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<script>
  // pestaña del menú según de qué sección viene (Kasalis o Línea)
  (function(){ var m = location.hash.match(/^#(?:nueva|lista)\/(kasalis|linea)/), a = m ? m[1] : null;
    try{ if(a) sessionStorage.setItem('jd_inst_app', a); else a = sessionStorage.getItem('jd_inst_app'); }catch(e){}
    document.documentElement.dataset.tab = a || 'kasalis'; })();
</script>
<script src="/shared/theme.js"></script>
<script src="/shared/app.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/ui.css">
<style>
body{font-family:Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px var(--pad-b)}
body.editing .wrap{padding-bottom:calc(var(--nav-h) + 40px)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
header .round{width:40px;height:40px}
.ht{flex:1;min-width:0;display:grid}
.ht b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
.hbtn.pri{background:var(--invert);color:var(--invert-ink);border-color:var(--invert)}
.hbtn:disabled{opacity:.45}
.c{--a:#FF7F66}.c.linea{--a:#2F6BFF}

/* lista */
.tools{display:flex;gap:8px;margin:4px 0 14px}
.tools input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:16px;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .cards{grid-template-columns:repeat(3,minmax(0,1fr))} }
.card2{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0;cursor:pointer}
.card2:active{transform:scale(.98)}
.cover{aspect-ratio:4/3;background:var(--surface2);position:relative;display:grid;place-items:center;color:var(--ink3)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover svg{width:34px;height:34px}
.card2 .m{padding:10px 12px 12px;display:grid;gap:3px;min-width:0}
.card2 b{font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card2 small{font-size:12px;color:var(--ink2)}
.est{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(224,163,46,.16);color:#B07A10;width:max-content}
.est.rechazada{background:rgba(127,127,127,.16);color:var(--ink2)}
:root[data-theme="dark"] .est{color:#E8B547}
.cover .est{position:absolute;left:8px;top:8px}
.vacio{text-align:center;color:var(--ink2);padding:36px 16px;border:2px dashed var(--line);border-radius:22px;display:grid;gap:12px;justify-items:center;font-size:14.5px}

/* lectura */
.rt{font-size:27px;line-height:1.15;letter-spacing:-.5px;margin:6px 0 6px}
.rd{color:var(--ink2);margin:0 0 8px;font-size:15px}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.rmeta .tg{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2)}
.rmeta .tg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a)}
.aviso{border:1.5px dashed rgba(224,163,46,.6);background:rgba(224,163,46,.08);border-radius:16px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.aviso .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rbody{display:grid;gap:14px}
.rstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.num{width:34px;height:34px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.rtext{padding-top:5px;font-size:16.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.rnote{background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.rnote::before{content:"Nota";display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.rfig{margin:0 0 0 46px;display:grid;gap:6px}
.rfig img{width:100%;max-height:70vh;object-fit:contain;background:var(--surface2);border-radius:16px;display:block;cursor:zoom-in}
.rfig figcaption{font-size:13px;color:var(--ink2)}
@media (max-width:460px){ .rfig{margin-left:0} }

/* editor */
.ed{display:grid;gap:10px}
.etitle{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:24px;font-weight:800;letter-spacing:-.4px;padding:6px 2px}
.etitle:focus,.edesc:focus{outline:none}
.edesc,.blk textarea,.cap{width:100%;border:1px solid transparent;border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1.45;padding:11px 12px;resize:none;overflow:hidden;display:block}
.edesc{min-height:48px}
.seg2{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2);width:max-content}
.seg2 button{height:34px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--ink2);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg2 button i{width:8px;height:8px;border-radius:50%}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.recup{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.recup button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px 10px;display:grid;gap:8px}
.blk.nota{background:var(--surface2)}
.blk textarea{background:var(--bg);min-height:56px}
.blk.nota textarea{background:var(--surface)}
.bh{display:flex;align-items:center;gap:6px;min-height:34px}
.btag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.blk.paso .btag{color:var(--a)}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.bact{margin-left:auto;display:flex;gap:2px}
.bact button{width:36px;height:34px;border:0;background:none;color:var(--ink2);border-radius:10px;display:grid;place-items:center;cursor:pointer}
.bact button:active{background:var(--surface2)}
.bact button:disabled{opacity:.3}
.bact button svg{width:19px;height:19px}
.bact button.sure{width:auto;padding:0 10px;background:var(--fail);color:#fff;font:inherit;font-size:12.5px;font-weight:700}
.eimg{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2)}
.eimg img{width:100%;max-height:52vh;object-fit:contain;display:block}
.upst{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.upst button{border:0;background:#fff;color:#111;border-radius:7px;padding:2px 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.cap{background:var(--bg);font-size:15px;padding:9px 11px}
.ins{position:relative;display:grid;justify-items:center;padding:2px 0}
.ins::before{content:"";position:absolute;left:22%;right:22%;top:17px;border-top:1px dashed var(--line)}
.insbtn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.ins.open .insbtn{background:var(--invert);color:var(--invert-ink);border-color:var(--invert);transform:rotate(45deg)}
.insm{display:flex;gap:6px;margin-top:6px}
.insm button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.edvac{text-align:center;color:var(--ink2);font-size:14px;padding:26px 12px;border:2px dashed var(--line);border-radius:18px}

/* barra para agregar (toma el lugar del menú mientras se edita) */
body.editing .gnav,body.editing .ap-fab{display:none!important}
.addbar{position:fixed;left:var(--nav-side);right:var(--nav-side);bottom:var(--nav-gap);z-index:40;height:var(--nav-pill);display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.55)}
:root[data-theme="dark"] .addbar{border-color:transparent;box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--glass)}
.addbar button{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.addbar button svg{width:24px;height:24px}
.addbar button:active{transform:scale(.92);background:var(--glass-on)}
@media (min-width:900px){ .addbar{max-width:420px;left:50%;right:auto;width:420px;transform:translateX(-50%)} }

/* visor de foto */
.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom))}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.err{color:var(--fail);font-size:14px}
</style></head><body>
<div class="wrap c" id="root">
  <header id="hdr"></header>
  <div id="out"><div class="vacio">Cargando…</div></div>
</div>
<nav class="addbar" id="addbar" hidden>
  <button data-add="txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Texto</button>
  <button data-add="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Cámara</button>
  <button data-add="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>Galería</button>
</nav>
<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="libIn" type="file" accept="image/*" multiple hidden>
<script type="module" src="app.js"></script>
</body></html>
